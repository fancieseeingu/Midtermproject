<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cart Confirmation - Bejeweled</title>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #fafafa;
      margin: 0;
      padding: 0;
      color: #333;
    }

    header, footer {
      background: #fff;
      padding: 15px 50px;
      border-bottom: 1px solid #eee;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      font-family: "Great Vibes", cursive;
      font-size: 38px;
      margin: 0;
    }

    nav {
      display: flex;
      gap: 20px;
    }

    nav a {
      text-decoration: none;
      color: #555;
      font-weight: bold;
      font-size: 15px;
    }

    nav a:hover {
      color: #FFC55A;
      text-decoration: underline;
      transition: 0.3s ease;
    }

    .section {
      text-align: center;
      padding: 60px 20px;
    }

    .section h2 {
      font-size: 28px;
      margin-bottom: 20px;
    }

    .section p {
      font-size: 18px;
      margin-bottom: 30px;
    }

    .section a {
      display: inline-block;
      padding: 10px 20px;
      background: #00215E;
      color: #fff;
      text-decoration: none;
      border-radius: 4px;
      font-weight: bold;
    }

    .section a:hover {
      background: #FFC55A;
      color: #fff;
      transition: 0.3s ease;
    }

    footer {
      text-align: center;
      font-size: 14px;
      border-top: 1px solid #eee;
      color: #444;
      padding: 20px;
    }
  </style>
</head>
<body>

  <header>
    <h1>Bejeweled</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="necklaces.html">Necklaces</a>
      <a href="rings.html">Rings</a>
      <a href="earring.html">Earrings</a>
      <a href="bracelet.html">Bracelets</a>
    </nav>
  </header>

  <section class="section">
    <h2>Item Added to Cart!</h2>
    <p>Your selected necklace has been successfully added to your cart.</p>
    <a href="bracelet.html">Continue Shopping</a>
  </section>

  <footer>

  </footer>

</body>
</html>
